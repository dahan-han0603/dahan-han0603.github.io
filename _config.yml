# About Section
# about_title: About Me
about_profile_image: images/profile.png
about_content: | # this will include new lines to allow paragraphs
  저는 2019년 6월부터 다양한 도메인에서 백엔드 개발 경험을 쌓아온 개발자입니다. 전자정부 프레임워크 기반의 공공·민간 프로젝트를 시작으로, OpenSearch 기반 사내 통합검색 구축, Java 빌드 도구 개발 및 배포, Spring Boot 기반 서비스 개발 등 업무와 개발 환경을 개선하는 작업을 수행해왔습니다.

  최근에는 Java/Spring 기반 그룹웨어 솔루션 개발을 중심으로 대학교, 공공기관, 기업 고객사의 신규 구축·전환·고도화 프로젝트를 수행했습니다. ERP 연동, SSO 연동, 커스텀 기능 개발, 데이터 마이그레이션 등 주요 기능 개발과 함께 PL 역할을 맡았으며, 일부 프로젝트에서는 PM으로서 요구사항 분석, 고객 커뮤니케이션, 납품 및 설치 지원까지 프로젝트 전반을 관리했습니다.

  최근 재직한 회사에서는 솔루션개발팀 팀장으로서 외부 프로젝트 수행뿐만 아니라 내부 개발 문화 개선에도 집중했습니다. YouTrack을 도입해 프로젝트 관리 체계를 정립하고, 코드리뷰, 데일리 스크럼, 주간 회의, 분기 면담, 분기 회고 등 팀의 개발 프로세스를 개선했습니다. 또한 사내 확장 플러그인, n8n 기반 자동 리포트 발송 파이프라인, 배포 서포트 도구 등을 개발하여 개발자의 업무 효율을 높이는 데 기여했습니다.

  저는 단순히 기능을 구현하는 것을 넘어, 문제를 구조적으로 이해하고 더 나은 개발 환경과 서비스를 만드는 데 관심이 많습니다. 앞으로도 기술적 도전과 조직의 성장을 함께 만들어가는 개발자가 되고자 합니다.

